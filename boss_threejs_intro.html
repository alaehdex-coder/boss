<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOSS | Golden 3D Intro</title>
  <style>
    :root { --gold: #ffd34f; --gold-bright: #fff0a3; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050403; }
    body { font-family: Inter, Arial, sans-serif; color: #fff7d7; }
    #scene { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .vignette {
      pointer-events: none; position: fixed; inset: 0; z-index: 2;
      background: radial-gradient(ellipse at 50% 46%, transparent 20%, rgba(0,0,0,.22) 63%, rgba(0,0,0,.88) 120%);
    }
    .hud {
      position: fixed; z-index: 3; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between; padding: 34px 6vw 26px;
      pointer-events: none; text-align: center;
    }
    .eyebrow { font-size: 11px; letter-spacing: .48em; color: #eac76a; text-transform: uppercase; }
    .headline { margin-top: 12px; font-size: clamp(10px, 1.1vw, 14px); letter-spacing: .32em; color: #a89b7a; text-transform: uppercase; }
    .bottom { display: flex; width: 100%; justify-content: space-between; align-items: end; gap: 20px; }
    .caption { font-size: 10px; letter-spacing: .25em; line-height: 1.8; color: rgba(255,230,158,.62); text-transform: uppercase; text-align: left; }
    .hint { font-size: 10px; letter-spacing: .18em; color: rgba(255,230,158,.52); text-transform: uppercase; text-align: right; }
    .soundless { display: inline-block; border: 1px solid rgba(255,211,79,.28); border-radius: 999px; padding: 10px 15px; }
    @media (max-width: 600px) {
      .hud { padding: 24px 20px 18px; }
      .eyebrow { letter-spacing: .3em; }
      .bottom { align-items: end; }
      .caption, .hint { font-size: 8px; letter-spacing: .13em; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="scene"></div>
  <div class="vignette"></div>
  <div class="hud">
    <div>
      <div class="eyebrow">Authority · Vision · Excellence</div>
      <div class="headline">A golden standard</div>
    </div>
    <div class="bottom">
      <div class="caption">BOSS / 001<br>Built to stand out</div>
      <div class="hint"><span class="soundless">Move your cursor to interact</span></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

    const mount = document.getElementById('scene');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050403);
    scene.fog = new THREE.FogExp2(0x050403, 0.035);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.1, 10.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    mount.appendChild(renderer.domElement);

    const gold = new THREE.MeshStandardMaterial({
      color: 0xffc629, metalness: 1, roughness: 0.2,
      emissive: 0x8c4b00, emissiveIntensity: 0.24
    });
    const goldBright = new THREE.MeshStandardMaterial({
      color: 0xffe69a, metalness: 0.92, roughness: 0.16,
      emissive: 0xffa500, emissiveIntensity: 0.35
    });
    const darkGold = new THREE.MeshStandardMaterial({ color: 0x6c3c05, metalness: 0.95, roughness: 0.28 });
    const blackMetal = new THREE.MeshStandardMaterial({ color: 0x100d08, metalness: 0.85, roughness: 0.24 });

    scene.add(new THREE.AmbientLight(0xffd987, 0.72));
    const keyLight = new THREE.PointLight(0xffc52e, 180, 24);
    keyLight.position.set(-4, 4, 5); scene.add(keyLight);
    const fillLight = new THREE.PointLight(0xfff0bd, 125, 22);
    fillLight.position.set(4, 1, 3); scene.add(fillLight);
    const rimLight = new THREE.PointLight(0xff8500, 210, 20);
    rimLight.position.set(0, 3, -4); scene.add(rimLight);
    const floorLight = new THREE.PointLight(0xffbd26, 90, 12);
    floorLight.position.set(0, -1.2, 2); scene.add(floorLight);

    const stage = new THREE.Group();
    scene.add(stage);

    // Reflective dark floor and layered circular pedestal
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({
      color: 0x080705, metalness: 0.72, roughness: 0.28
    }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = -1.65; floor.receiveShadow = true; scene.add(floor);

    function cylinder(radiusTop, radiusBottom, height, y, material, segments = 128) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments), material);
      mesh.position.y = y; mesh.castShadow = true; mesh.receiveShadow = true; stage.add(mesh); return mesh;
    }
    cylinder(2.95, 3.12, 0.22, -1.34, blackMetal);
    cylinder(2.84, 2.98, 0.08, -1.19, gold);
    cylinder(2.72, 2.86, 0.12, -1.08, blackMetal);
    cylinder(2.58, 2.72, 0.045, -1.0, goldBright);

    function torus(radius, tube, material, y, rx = Math.PI / 2) {
      const mesh = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 12, 180), material);
      mesh.rotation.x = rx; mesh.position.y = y; stage.add(mesh); return mesh;
    }
    const baseRing1 = torus(2.95, 0.025, goldBright, -1.19);
    const baseRing2 = torus(2.63, 0.018, gold, -0.97);

    // Text uses a Three.js typeface loaded from its public examples CDN.
    const loader = new FontLoader();
    const titleGroup = new THREE.Group();
    stage.add(titleGroup);
    let titleMesh;
    loader.load('https://cdn.jsdelivr.net/npm/three@0.164.1/examples/fonts/helvetiker_bold.typeface.json', (font) => {
      const geometry = new TextGeometry('BOSS', {
        font, size: 1.7, depth: 0.36, curveSegments: 16,
        bevelEnabled: true, bevelThickness: 0.075, bevelSize: 0.045, bevelSegments: 5
      });
      geometry.computeBoundingBox();
      geometry.center();
      titleMesh = new THREE.Mesh(geometry, gold);
      titleMesh.castShadow = true;
      titleMesh.receiveShadow = true;
      titleGroup.add(titleMesh);

      // Fine bright outline accent behind the main letters
      const backGeometry = new TextGeometry('BOSS', {
        font, size: 1.7, depth: 0.4, curveSegments: 10,
        bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.04, bevelSegments: 3
      });
      backGeometry.center();
      const backing = new THREE.Mesh(backGeometry, darkGold);
      backing.position.z = -0.12;
      backing.scale.set(1.012, 1.012, 1.02);
      titleGroup.add(backing);
    }, undefined, (error) => {
      console.error('Could not load the 3D font:', error);
    });
    titleGroup.position.set(0, 0.15, 0);
    titleGroup.rotation.x = -0.035;

    // Crown assembled from gold shapes, bars and spheres
    const crown = new THREE.Group();
    stage.add(crown);
    crown.position.set(0, 2.03, 0.1);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.92, 1.08, 0.27, 9, 1, true), goldBright);
    band.rotation.y = Math.PI / 9; band.castShadow = true; crown.add(band);
    const bandBase = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.075, 12, 80), gold);
    bandBase.rotation.x = Math.PI / 2; bandBase.position.y = -0.13; crown.add(bandBase);
    const bandTop = new THREE.Mesh(new THREE.TorusGeometry(0.92, 0.045, 10, 80), goldBright);
    bandTop.rotation.x = Math.PI / 2; bandTop.position.y = 0.13; crown.add(bandTop);

    const points = [];
    for (let i = 0; i < 7; i++) {
      const a = (i / 6) * Math.PI - Math.PI / 2;
      points.push(new THREE.Vector3(Math.cos(a) * 0.91, 0.12, Math.sin(a) * 0.12));
      const peak = new THREE.Vector3(Math.cos(a) * 1.03, 0.52 + (i === 3 ? 0.28 : (i % 2 === 0 ? 0.08 : 0)), Math.sin(a) * 0.12);
      const curve = new THREE.QuadraticBezierCurve3(points[i], new THREE.Vector3(Math.cos(a) * 0.94, 0.28, 0.04), peak);
      const wire = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.035, 8, false), goldBright);
      crown.add(wire);
      const orb = new THREE.Mesh(new THREE.SphereGeometry(i === 3 ? 0.105 : 0.075, 16, 12), goldBright);
      orb.position.copy(peak); crown.add(orb);
    }
    const jewel = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 0), goldBright);
    jewel.position.set(0, 0.77, 0.05); jewel.scale.set(0.7, 1.3, 0.55); crown.add(jewel);
    for (let i = 0; i < 9; i++) {
      const bead = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), goldBright);
      const a = i / 9 * Math.PI * 2;
      bead.position.set(Math.cos(a) * 1.02, -0.02, Math.sin(a) * 0.16);
      crown.add(bead);
    }

    // Orbiting energy rings
    const orbitGroup = new THREE.Group(); stage.add(orbitGroup);
    const orbit1 = new THREE.Mesh(new THREE.TorusGeometry(3.45, 0.018, 8, 240), goldBright);
    orbit1.rotation.set(1.12, 0.18, 0.15); orbitGroup.add(orbit1);
    const orbit2 = new THREE.Mesh(new THREE.TorusGeometry(3.15, 0.012, 8, 240), gold);
    orbit2.rotation.set(1.35, -0.48, -0.24); orbitGroup.add(orbit2);
    const orbit3 = new THREE.Mesh(new THREE.TorusGeometry(3.7, 0.009, 8, 240), goldBright);
    orbit3.rotation.set(1.42, 0.62, 0.36); orbitGroup.add(orbit3);

    // Particle field
    const particleCount = 1300;
    const positions = new Float32Array(particleCount * 3);
    const particleData = [];
    for (let i = 0; i < particleCount; i++) {
      const radius = 2.4 + Math.random() * 8.5;
      const angle = Math.random() * Math.PI * 2;
      const y = (Math.random() - 0.35) * 7.5;
      positions[i * 3] = Math.cos(angle) * radius;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
      particleData.push({ radius, angle, y, speed: 0.08 + Math.random() * 0.34 });
    }
    const particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particles = new THREE.Points(particleGeometry, new THREE.PointsMaterial({
      color: 0xffc83d, size: 0.035, transparent: true, opacity: 0.82,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    scene.add(particles);

    // Occasional gold sparks as small glowing points
    const sparkGroup = new THREE.Group(); scene.add(sparkGroup);
    const sparks = [];
    for (let i = 0; i < 65; i++) {
      const spark = new THREE.Mesh(new THREE.SphereGeometry(0.018 + Math.random() * 0.025, 6, 6), goldBright);
      spark.position.set((Math.random() - .5) * 8, (Math.random() - .25) * 5, (Math.random() - .5) * 5);
      spark.userData = { phase: Math.random() * Math.PI * 2, speed: .4 + Math.random() * 1.4, baseY: spark.position.y };
      sparkGroup.add(spark); sparks.push(spark);
    }

    // Mouse/touch parallax
    const pointer = new THREE.Vector2(0, 0);
    addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / innerWidth - 0.5) * 2;
      pointer.y = (e.clientY / innerHeight - 0.5) * 2;
    }, { passive: true });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      titleGroup.position.y = 0.15 + Math.sin(t * 1.2) * 0.075;
      titleGroup.rotation.y = Math.sin(t * 0.45) * 0.10 + pointer.x * 0.045;
      titleGroup.rotation.x = -0.035 + pointer.y * 0.025;

      crown.rotation.y = Math.sin(t * 0.7) * 0.18 + pointer.x * 0.08;
      crown.position.y = 2.03 + Math.sin(t * 1.4) * 0.055;
      crown.rotation.z = Math.sin(t * 0.55) * 0.035;

      orbitGroup.rotation.y = t * 0.16;
      orbitGroup.rotation.z = Math.sin(t * 0.3) * 0.06;
      orbit1.material.opacity = 0.75 + Math.sin(t * 2.4) * 0.2;
      baseRing1.rotation.z = t * 0.15;
      baseRing2.rotation.z = -t * 0.22;

      const pos = particleGeometry.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        const p = particleData[i];
        p.angle += p.speed * 0.002;
        pos[i * 3] = Math.cos(p.angle) * p.radius;
        pos[i * 3 + 1] = p.y + Math.sin(t * p.speed + p.angle) * 0.15;
      }
      particleGeometry.attributes.position.needsUpdate = true;

      sparks.forEach((spark) => {
        spark.position.y = spark.userData.baseY + Math.sin(t * spark.userData.speed + spark.userData.phase) * 0.3;
        spark.position.x += Math.sin(t * 0.4 + spark.userData.phase) * 0.0008;
        const pulse = 0.55 + 0.45 * Math.sin(t * 3 + spark.userData.phase);
        spark.scale.setScalar(pulse);
      });

      camera.position.x += (pointer.x * 0.42 - camera.position.x) * 0.025;
      camera.position.y += (1.1 - pointer.y * 0.22 - camera.position.y) * 0.025;
      camera.lookAt(0, 0.35, 0);

      keyLight.intensity = 165 + Math.sin(t * 1.8) * 18;
      floorLight.intensity = 78 + Math.sin(t * 2.3) * 18;
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
